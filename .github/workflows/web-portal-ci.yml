name: Web Portal CI

on:
  push:
    paths:
      - "web-portal/**"
      - ".github/workflows/web-portal-ci.yml"
  pull_request:
    paths:
      - "web-portal/**"
      - ".github/workflows/web-portal-ci.yml"

concurrency:
  group: web-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-portal
    env:
      DATABASE_URL: postgresql://test:test@example.neon.tech/neondb?sslmode=require
      NEON_AUTH_BASE_URL: https://example.neonauth.eu-west-2.aws.neon.tech/neondb/auth
      NEON_AUTH_COOKIE_SECRET: test-cookie-secret-at-least-32-characters-long
      ACADEMY_ADMIN_EMAILS: admin@example.com
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CONSULTATION_URL: mailto:Support@kydosdigital.com
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PRICE_BLUEPRINT: price_placeholder_blueprint
      STRIPE_PRICE_BUILD: price_placeholder_build
      STRIPE_PRICE_DFY: price_placeholder_dfy
      ENABLE_LIVE_CHECKOUT: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate programme content
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
