name: Web Portal CI

on:
  push:
    paths:
      - "web-portal/**"
      - ".github/workflows/web-portal-ci.yml"
  pull_request:
    paths:
      - "web-portal/**"
      - ".github/workflows/web-portal-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-portal
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CONSULTATION_URL: mailto:Support@kydosdigital.com
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PRICE_BLUEPRINT: price_placeholder_blueprint
      STRIPE_PRICE_BUILD: price_placeholder_build
      STRIPE_PRICE_DFY: price_placeholder_dfy
      ENABLE_LIVE_CHECKOUT: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-portal/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
